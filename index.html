<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala Visual Análoga EVA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="images" id="pain-images">
            <img id="img-sin" src="sin_dolor.png" alt="Sin dolor" class="pain-image" />
            <img id="img-leve" src="leve.png" alt="Dolor leve" class="pain-image" />
            <img id="img-moderado" src="moderado.png" alt="Dolor moderado" class="pain-image" />
            <img id="img-severo" src="severo.png" alt="Dolor severo" class="pain-image" />
            <img id="img-insoportable" src="insoportable.png" alt="Dolor insoportable" class="pain-image" />
        </div>
        <div class="labels">
            <span><span id="left-triangle">◄</span> Sin dolor</span>
            <span>Dolor insoportable <span id="right-triangle">►</span></span>
        </div>
        <div class="bar-container">
            <div class="bar"></div>
            <div class="slider" id="slider"></div>
        </div>
        <div class="numbers">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
        </div>
        <div class="result-container">
            <div>
                <button id="calculate">Calcular resultado:</button>
                <span id="result">0.0 cm</span>
            </div>
            <button id="toggle-numbers">Ocultar/Mostrar Números</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
