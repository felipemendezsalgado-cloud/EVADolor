<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Dolor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="labels">
            <span>Sin dolor</span>
            <span>Dolor insoportable</span>
        </div>
        <div class="bar-container">
            <div class="bar"></div>
            <div class="slider" id="slider"></div>
        </div>
        <div class="numbers">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
        </div>
        <div class="result-container">
            <div>
                <button id="calculate">Calcular resultado:</button>
                <span id="result">0.0 cm</span>
            </div>
            <button id="toggle-numbers">Ocultar/Mostrar Números</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
